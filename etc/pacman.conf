# Arch Linux package manager configuration. Review before deploying.
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
VerbosePkgLists
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enable only when 32-bit software is required.
#[multilib]
#Include = /etc/pacman.d/mirrorlist
